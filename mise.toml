[settings]
# Cloudflare Workers Builds は mise.toml を読まず .node-version を読む。Node の版は
# .node-version に置き、ローカル / CI の mise にも同じファイルを読ませる
idiomatic_version_file_enable_tools = ["node"]

[tools]
go = "1.25"
lefthook = "2"
pnpm = "12"

[tasks.setup]
description = "Install dependencies, restore project skills, and set up git hooks"
run = [
  "pnpm install",
  "pnpm skills experimental_install",
  "pnpm exec playwright install chromium --with-deps",
  "lefthook install",
]

[tasks."build:wasm"]
description = "Build the Yaegi wasm runtime and wasm_exec.js into public/wasm (gitignored)"
run = "bash wasm/build.sh"
